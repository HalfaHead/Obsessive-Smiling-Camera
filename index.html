<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Access</title>
  <style>
    body {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
    }

    .left-container {
      flex: 2;
      display: flex;
      justify-content: center;
      align-items: flex-end; /* Move content down */
      height: 90vh; /* Increased height */
      padding-bottom: 50px; /* Space for title */
    }

    #video {
      width: 90%; /* Larger webcam feed */
      height: 100%; /* Taller video */
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      transform: scaleX(-1);
    }

    .right-container {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(2, 1fr); /* Reverted arrangement */
      grid-template-rows: repeat(3, 1fr);
      gap: 10px;
      justify-items: center;
      align-items: center;
    }

    .smile-box {
      width: 150px;
      height: 150px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 3px 5px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.5em;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="left-container">
    <video id="video" autoplay></video>
  </div>
  <div class="right-container">
    <div class="smile-box">Smile 1</div>
    <div class="smile-box">Smile 2</div>
    <div class="smile-box">Smile 3</div>
    <div class="smile-box">Smile 4</div>
    <div class="smile-box">Smile 5</div>
  </div>
  <script>
    const video = document.getElementById('video');
    
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ video: true })
        .then((stream) => {
          video.srcObject = stream;
        })
        .catch((error) => {
          console.log("Error accessing camera: ", error);
          alert("Error accessing camera. Please check permissions.");
        });
    } else {
      alert("Your browser does not support camera access.");
    }
  </script>
</body>
</html>
